<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="wingGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="wingGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="wingGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="6"/>

  <g transform="translate(0, -10)">
    <!-- Wings Outer Layer -->
    <path d="M 256 280 C 217 267 166 241 163 140 C 192 153 225 158 256 166 Z" fill="url(#wingGrad1)" filter="url(#glow)"/>
    <path d="M 256 280 C 295 267 346 241 349 140 C 320 153 287 158 256 166 Z" fill="url(#wingGrad1)" filter="url(#glow)"/>

    <!-- Wings Middle Layer -->
    <path d="M 256 280 C 225 269 184 249 179 160 C 204 170 230 173 256 174 Z" fill="url(#wingGrad2)"/>
    <path d="M 256 280 C 287 269 328 249 333 160 C 308 170 282 173 256 174 Z" fill="url(#wingGrad2)"/>

    <!-- Wings Inner Layer -->
    <path d="M 256 280 C 235 272 205 254 199 180 C 217 188 238 188 256 182 Z" fill="url(#wingGrad3)"/>
    <path d="M 256 280 C 277 272 307 254 313 180 C 295 188 274 188 256 182 Z" fill="url(#wingGrad3)"/>

    <!-- Center Flame / Bookmark -->
    <path d="M 256 130 Q 266 170 261 285 L 256 292 L 251 285 Q 246 170 256 130 Z" fill="url(#flameGrad)" filter="url(#glow)"/>

    <!-- Glowing Star -->
    <polygon points="256,118 261,126 270,128 263,134 265,143 256,138 247,143 249,134 242,128 251,126" fill="#ffffff"/>

    <!-- Brand Typography -->
    <text x="256" y="360" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="54" fill="#ffffff" letter-spacing="8" filter="url(#glow)">LIBRA</text>
    <text x="256" y="398" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="16" fill="#94a3b8" letter-spacing="4">SDN PENGASINAN VII</text>
  </g>
</svg>
